# Local PostgreSQL for development: `yarn db:up`. Version 10, as on host.md; dev-only credentials.
services:
  postgres:
    image: postgres:10
    restart: unless-stopped
    environment:
      POSTGRES_USER: nba
      POSTGRES_PASSWORD: nba
      POSTGRES_DB: nails_by_alynna
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'nba', '-d', 'nails_by_alynna']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
