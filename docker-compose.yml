# Local MongoDB for development: `yarn db:up` (or use a Homebrew mongod / MongoDB Atlas).
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
